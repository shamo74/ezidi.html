<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساهمة ترجمة الإيزيدية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.5em;
            color: #4a5568;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 1em;
            color: #2d3748;
            text-align: right;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .success-message {
            display: none;
            color: #4caf50;
            font-size: 1em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مساهمة</h1>
        <form id="botForm">
            <label for="senderName">اسمك (𐺢𐺀𐺛𐺩 𐺕𐺦)</label>
            <input type="text" id="senderName" name="senderName" required>

            <label for="arabicWords">كلمة العربية</label>
            <textarea id="arabicWords" name="arabicWords" rows="3" required></textarea>

            <label for="yezidiWords">كلمة ايزيدي(𐺩𐺏𐺨𐺋𐺨)</label>
            <textarea id="yezidiWords" name="yezidiWords" rows="3" required></textarea>

            <button type="button" onclick="sendToBot()">إضافة إلى ترجمة</button>
        </form>
        <div class="success-message" id="successMessage">تم الإرسال بنجاح!</div>
    </div>

    <script>
        function sendToBot() {
            const senderName = document.getElementById('senderName').value;
            const arabicWords = document.getElementById('arabicWords').value;
            const yezidiWords = document.getElementById('yezidiWords').value;

            if (senderName && arabicWords && yezidiWords) {
                const chatId = '6431271423';
                const token = '6618648466:AAFGGTIx055y0eCRvq_z3ABqchHfLsqD0M4';
                const message = `
اسم المرسل: ${senderName}
كلمات عربي: ${arabicWords}
كلمات ايزيدي: ${yezidiWords}`;

                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message })
                })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('successMessage').style.display = 'block';
                        document.getElementById('botForm').reset();
                    } else {
                        alert('حدث خطأ أثناء الإرسال.');
                    }
                })
                .catch(() => alert('فشل الاتصال بالبوت.'));
            } else {
                alert('يرجى ملء جميع الحقول.');
            }
        }
    </script>
</body>
</html>
