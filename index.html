<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مساهمة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 50px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }

        h1 {
            color: #333;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مساهمة</h1>
        <form id="contributionForm">
            <label for="arabicWord">كلمة العربية:</label>
            <input type="text" id="arabicWord" name="arabicWord" required>
            <label for="yezidiWord">كلمة ايزيدي:</label>
            <input type="text" id="yezidiWord" name="yezidiWord" required>
            <button type="submit" id="addButton">إضافة إلى ترجمة</button>
        </form>
    </div>
    <script>
        document.getElementById("contributionForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const arabicWord = document.getElementById("arabicWord").value.trim();
            const yezidiWord = document.getElementById("yezidiWord").value.trim();

            if (!arabicWord || !yezidiWord) {
                alert("يرجى ملء جميع الحقول.");
                return;
            }

            // إرسال البيانات إلى الخادم لإضافتها إلى ملف JSON
            fetch('/add-word', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    arabicWord,
                    yezidiWord
                }),
            })
                .then((response) => response.json())
                .then((data) => {
                    if (data.success) {
                        alert("شكراً على الإضافة! تم تخزين الكلمة بنجاح.");
                        document.getElementById("contributionForm").reset();
                    } else {
                        alert("حدث خطأ أثناء إضافة الكلمة.");
                    }
                })
                .catch(() => {
                    alert("تعذر الاتصال بالخادم.");
                });
        });
    </script>
</body>
</html>
